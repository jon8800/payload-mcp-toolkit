name: CI

on:
  push:
    branches: [main, release/payload-v4-next]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.15.0']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node --test scripts/release-target.test.mjs

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

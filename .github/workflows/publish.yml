name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 ships npm 11.x with OIDC handshake support. Do NOT set
      # `registry-url` — it writes `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc, which can shadow the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # Ensure npm CLI is >= 11.15.0 for Trusted Publishing OIDC exchange.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Patch HttpErrorGeneral to dump response body
        run: |
          NPM_LIB=$(npm root -g)
          TARGET="$NPM_LIB/npm/node_modules/npm-registry-fetch/lib/errors.js"
          cat > /tmp/patch.js <<'PATCH_EOF'
          const fs = require('fs')
          const p = process.argv[2]
          let s = fs.readFileSync(p, 'utf8')
          const inject = `\n    try { const b = arguments[2]; const str = (b && b.type === 'Buffer') ? Buffer.from(b.data).toString('utf8') : JSON.stringify(b); require('fs').writeSync(2, '\\n[DUMP] ' + str.slice(0, 2000) + '\\n') } catch (e) {}`
          s = s.replace(
            /(class HttpErrorGeneral extends HttpErrorBase \{[\s\S]*?constructor \([^)]*\) \{)/,
            '$1' + inject
          )
          fs.writeFileSync(p, s)
          PATCH_EOF
          node /tmp/patch.js "$TARGET"

      - run: npm publish --access public --provenance --ignore-scripts

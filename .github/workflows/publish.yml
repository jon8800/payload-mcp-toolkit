name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 ships npm 11.x with OIDC handshake support. Do NOT set
      # `registry-url` — it writes `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc, which can shadow the OIDC exchange.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # Ensure npm CLI is >= 11.15.0 for Trusted Publishing OIDC exchange.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Authenticated via GitHub Actions OIDC (Trusted Publishing on the
      # npm package). `--ignore-scripts` skips the package.json
      # prepublishOnly hook (which re-runs build/test via pnpm) since CI
      # already did both above.
      - run: npm publish --access public --provenance --ignore-scripts

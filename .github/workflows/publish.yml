name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Intentionally NOT setting `registry-url` — that option writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which shadows OIDC auth when no token is set. Trusted Publishing
      # requires a clean .npmrc so the CLI falls through to OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # npm Trusted Publishing requires npm CLI >= 11.5.0; setup-node@v4 with
      # Node 20 ships npm 10.x by default, so upgrade explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Authenticated via GitHub Actions OIDC (Trusted Publishing configured on
      # the npm package). No NPM_TOKEN required; the `id-token: write`
      # permission at the workflow level exposes the OIDC claim that npm
      # verifies against the package's trusted publisher config.
      - run: npm publish --access public --provenance

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24+ ships npm 11.x with the OIDC handshake support that
      # Trusted Publishing requires. Intentionally omit `registry-url` —
      # setting it writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which can shadow the OIDC exchange even when the env var is empty.
      # The canonical Trusted Publishing setup (per remarkablemark.org and
      # the npm docs working examples) is just `node-version: 24` with no
      # registry-url override.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Print OIDC claim (temporary diagnostic)
        run: |
          echo "Requesting OIDC token with audience=npm..."
          TOKEN=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" | jq -r .value)
          echo "Token received (len: ${#TOKEN})"
          echo "--- Decoded payload ---"
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # Pad base64 if needed
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -ne 0 ]; then PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $((4-MOD))))"; fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{repository, ref, workflow, workflow_ref, job_workflow_ref, event_name, environment, sub}' || echo "decode failed"

      - run: npm publish --access public --provenance --loglevel verbose

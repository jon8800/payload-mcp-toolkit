name: Publish checked Gallery prerelease

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'jon8800/payload-mcp-toolkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
      - name: Fetch the checked Gallery archive
        run: |
          curl --fail --location https://github.com/jon8800/payload-media-gallery/releases/download/v0.2.0-next.1/payload-media-gallery-0.2.0-next.1.tgz --output gallery.tgz
          echo '66b3536085075b8fdc4d1a4f940471efdf9356cdc14b8d4178b913e5de583e92  gallery.tgz' | sha256sum --check
          curl --fail --location https://raw.githubusercontent.com/jon8800/payload-canvas/a0fc48e/scripts/publish.mjs --output publish.mjs
      - name: Publish only the checked prerelease to next
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node publish.mjs --expect-version 0.2.0-next.1 gallery.tgz

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # Publishes via a raw authenticated PUT (see scripts/publish.mjs).
      # `npm publish` 403s on this account: security-key-only 2FA collides with
      # npm's CLI OTP flow. NOT a Cloudflare/registry problem — the registry
      # accepts a plain authenticated PUT with the bypass-2FA token below.
      - run: node scripts/publish.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

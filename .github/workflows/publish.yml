name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Diagnose npm auth (temporary)
        run: |
          echo "Token length: ${#NODE_AUTH_TOKEN}"
          echo "Token first 6 chars: ${NODE_AUTH_TOKEN:0:6}"
          echo "--- npm whoami ---"
          npm whoami || echo "whoami failed"
          echo "--- npm access ls-packages ---"
          npm access list packages 2>&1 | head -20 || echo "access ls failed"
          echo "--- npm view payload-mcp-toolkit (anon) ---"
          npm view payload-mcp-toolkit --json | head -20 || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

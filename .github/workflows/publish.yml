name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24+ ships npm 11.x with the OIDC handshake support that
      # Trusted Publishing requires. Intentionally omit `registry-url` —
      # setting it writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which can shadow the OIDC exchange even when the env var is empty.
      # The canonical Trusted Publishing setup (per remarkablemark.org and
      # the npm docs working examples) is just `node-version: 24` with no
      # registry-url override.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Authenticated via GitHub Actions OIDC (Trusted Publishing). No
      # NPM_TOKEN or NODE_AUTH_TOKEN — the `id-token: write` permission
      # plus the trusted publisher config on the npm package side is the
      # complete auth path. --provenance is required even though Trusted
      # Publishing docs suggest auto-provenance, since the CLI takes a
      # separate code path without the flag.
      - run: npm publish --access public --provenance --loglevel verbose

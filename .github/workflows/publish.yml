name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # `registry-url` writes an .npmrc pointing at npmjs.org. Without a
      # NODE_AUTH_TOKEN env var, the `_authToken=${NODE_AUTH_TOKEN}` line
      # resolves to empty — npm CLI 11.5+ then triggers the OIDC token
      # exchange against the configured trusted publisher. This is the
      # canonical Trusted Publishing setup per npm docs; do not drop
      # registry-url.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing requires npm CLI >= 11.5.0; setup-node@v4 with
      # Node 20 ships npm 10.x by default, so upgrade explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Diagnose OIDC + npm version (temporary)
        run: |
          echo "--- npm version ---"
          npm --version
          echo "--- OIDC env present? ---"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is set (OIDC available)"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL is EMPTY — id-token:write not effective"
          fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is set"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN is EMPTY"
          fi
          echo "--- .npmrc contents ---"
          cat ${NPM_CONFIG_USERCONFIG:-~/.npmrc} 2>&1 || echo "(no userconfig)"
          echo "--- npm whoami (anon expected if OIDC-only) ---"
          npm whoami 2>&1 || echo "whoami unauth (expected for OIDC-only)"

      # Authenticated via GitHub Actions OIDC (Trusted Publishing configured on
      # the npm package). No NPM_TOKEN required; the `id-token: write`
      # permission at the workflow level exposes the OIDC claim that npm
      # verifies against the package's trusted publisher config.
      - run: npm publish --access public --provenance --loglevel verbose

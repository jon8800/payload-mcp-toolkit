name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jon8800/payload-mcp-toolkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check version tag and npm channel
        id: release
        run: node scripts/release-target.mjs

      - run: node --test scripts/release-target.test.mjs

      - run: pnpm typecheck

      - run: pnpm test

      # Publishes via a raw authenticated PUT (see scripts/publish.mjs).
      # `npm publish` 403s on this account: security-key-only 2FA collides with
      # npm's CLI OTP flow. NOT a Cloudflare/registry problem — the registry
      # accepts a plain authenticated PUT with the bypass-2FA token below.
      - run: node scripts/publish.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.release.outputs.tag }}

name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24+ ships npm 11.x with the OIDC handshake support that
      # Trusted Publishing requires. Intentionally omit `registry-url` —
      # setting it writes `_authToken=${NODE_AUTH_TOKEN}` into .npmrc,
      # which can shadow the OIDC exchange even when the env var is empty.
      # The canonical Trusted Publishing setup (per remarkablemark.org and
      # the npm docs working examples) is just `node-version: 24` with no
      # registry-url override.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      - name: Diagnose .npmrc state right before publish
        run: |
          echo "--- npm config get userconfig ---"
          npm config get userconfig
          echo "--- userconfig contents ---"
          cat "$(npm config get userconfig)" 2>&1 || echo "(missing)"
          echo "--- cwd .npmrc ---"
          cat .npmrc 2>&1 || echo "(missing)"
          echo "--- env NODE_AUTH_TOKEN ---"
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "set (len ${#NODE_AUTH_TOKEN})"; else echo "empty"; fi

      # --ignore-scripts skips package.json lifecycle hooks (including
      # prepublishOnly which re-runs pnpm clean/build/test). Tests + build
      # already ran in earlier workflow steps, so prepublishOnly is
      # redundant in CI and may inject a tainted .npmrc that shadows OIDC.
      - run: npm publish --access public --provenance --ignore-scripts --loglevel verbose

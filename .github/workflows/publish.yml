name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # Node 24 ships npm 11.x with Trusted Publishing OIDC support.
      # Intentionally omit `registry-url` — that option writes
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, which can shadow the
      # OIDC exchange even when the env var is empty.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # Ensure npm CLI is >= 11.15.0 for Trusted Publishing OIDC exchange.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # Authenticated via GitHub Actions OIDC (Trusted Publishing configured
      # on the npm package side). No NPM_TOKEN, no NODE_AUTH_TOKEN — the
      # `id-token: write` permission plus the trusted publisher on the npm
      # package is the complete auth path.
      #
      # KNOWN ISSUE: npm registry is fronted by Cloudflare. Cloudflare's WAF
      # has been observed blocking PUT /payload-mcp-toolkit from GitHub
      # Actions runner IPs with an HTML "Sorry, you have been blocked"
      # response (HTTP 403). The OIDC exchange itself (POST /-/npm/v1/oidc/
      # token/exchange/...) passes through fine; only the actual publish
      # PUT is rejected. When this happens, fall back to publishing
      # locally from a developer machine — the trusted publisher config
      # remains valid for future runs once Cloudflare clears the block.
      # --ignore-scripts skips package.json's prepublishOnly (CI already
      # ran build + test above).
      - run: npm publish --access public --provenance --ignore-scripts
